<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     width="300" height="180" 
     viewBox="0 0 300 180">

  <!-- Marker definitions -->
  <defs>
    <marker id="zg-m-0" markerWidth="8" markerHeight="8" 
            refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 8 4, 0 8" fill="#666666"/>
    </marker>
    <style>
  .node { cursor: pointer; transition: all 0.2s ease; }
  .node:hover { filter: brightness(0.92); transform-origin: center; }
  .node:hover rect { stroke-width: 2.5; }
  .node.selected rect { stroke: #dc2626; stroke-width: 2.5; }
  .node.selected text { fill: #dc2626; }
</style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="white"/>
  <!-- Edges (rendered first, under nodes) -->
  <g id="edges">
    <line x1="70" y1="40" x2="150" y2="80" 
          stroke="#666666" stroke-width="2" marker-end="url(#zg-m-0)"/>
    <line x1="220" y1="40" x2="150" y2="80" 
          stroke="#666666" stroke-width="2" marker-end="url(#zg-m-0)"/>
    <line x1="150" y1="100" x2="150" y2="140" 
          stroke="#666666" stroke-width="2" marker-end="url(#zg-m-0)"/>
  </g>

  <!-- Nodes -->
  <g id="nodes">
    <g transform="translate(20,20)" fill="#f0f9ff" stroke="#0284c7" class="node" data-id="1">
      <rect x="0" y="0" width="110" height="20" rx="4" ry="4"/>
<text x="55" y="14" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" stroke="none">Click me!</text>
    </g>
    <g transform="translate(160,20)" fill="#f0f9ff" stroke="#0284c7" class="node" data-id="2">
      <rect x="0" y="0" width="120" height="20" rx="4" ry="4"/>
<text x="60" y="14" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" stroke="none">Hover here</text>
    </g>
    <g transform="translate(100,80)" fill="#f0f9ff" stroke="#0284c7" class="node" data-id="3">
      <rect x="0" y="0" width="100" height="20" rx="4" ry="4"/>
<text x="50" y="14" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" stroke="none">Try both</text>
    </g>
    <g transform="translate(110,140)" fill="#f0f9ff" stroke="#0284c7" class="node" data-id="4">
      <rect x="0" y="0" width="80" height="20" rx="4" ry="4"/>
<text x="40" y="14" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" stroke="none">Output</text>
    </g>
  </g>
  <script>
  document.querySelectorAll('.node').forEach(el => {
    el.addEventListener('click', () => {
      el.classList.toggle('selected');
      const id = el.getAttribute('data-id');
      const label = el.querySelector('text')?.textContent;
      console.log(`Node ${id} (${label}): ${el.classList.contains('selected') ? 'selected' : 'deselected'}`);
    });
  });
</script>
</svg>
