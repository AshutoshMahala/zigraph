<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     width="480" height="540" 
     viewBox="0 0 480 540">

  <!-- Marker definitions -->
  <defs>
    <marker id="zg-m-0" markerWidth="8" markerHeight="8" 
            refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 8 4, 0 8" fill="#666666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="white"/>
  <!-- Subgraphs -->
  <g id="subgraphs">
    <g transform="translate(40,400)" fill="#dbeafe" fill-opacity="0.5" stroke="#3b82f6">
      <rect x="0" y="0" width="290" height="120" rx="8" ry="8"/>
<text x="8" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#3b82f6" stroke="none">Storage</text>
    </g>
    <g transform="translate(20,80)" fill="#dbeafe" fill-opacity="0.5" stroke="#3b82f6">
      <rect x="0" y="0" width="440" height="280" rx="8" ry="8"/>
<text x="8" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#3b82f6" stroke="none">Platform</text>
    </g>
    <g transform="translate(40,140)" fill="#dcfce7" fill-opacity="0.5" stroke="#22c55e">
      <rect x="0" y="0" width="140" height="180" rx="8" ry="8"/>
<text x="8" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#22c55e" stroke="none">Commerce</text>
    </g>
    <g transform="translate(200,140)" fill="#dcfce7" fill-opacity="0.5" stroke="#22c55e">
      <rect x="0" y="0" width="240" height="180" rx="8" ry="8"/>
<text x="8" y="16" font-family="sans-serif" font-size="11" font-weight="600" fill="#22c55e" stroke="none">Identity</text>
    </g>
  </g>
  <!-- Edges (rendered first, under nodes) -->
  <g id="edges">
    <line x1="100" y1="40" x2="290" y2="200" 
          stroke="#666666" stroke-width="2" marker-end="url(#zg-m-0)"/>
    <line x1="100" y1="40" x2="110" y2="200" 
          stroke="#666666" stroke-width="2" marker-end="url(#zg-m-0)"/>
    <line x1="290" y1="220" x2="250" y2="260" 
          stroke="#666666" stroke-width="2" marker-end="url(#zg-m-0)"/>
    <line x1="290" y1="220" x2="370" y2="260" 
          stroke="#666666" stroke-width="2" marker-end="url(#zg-m-0)"/>
    <line x1="110" y1="220" x2="110" y2="260" 
          stroke="#666666" stroke-width="2" marker-end="url(#zg-m-0)"/>
    <line x1="250" y1="280" x2="110" y2="460" 
          stroke="#666666" stroke-width="2" marker-end="url(#zg-m-0)"/>
    <line x1="370" y1="280" x2="270" y2="460" 
          stroke="#666666" stroke-width="2" marker-end="url(#zg-m-0)"/>
    <line x1="110" y1="280" x2="110" y2="460" 
          stroke="#666666" stroke-width="2" marker-end="url(#zg-m-0)"/>
  </g>

  <!-- Nodes -->
  <g id="nodes">
    <g transform="translate(40,20)" fill="#f8fafc" stroke="#64748b">
      <rect x="0" y="0" width="130" height="20" rx="4" ry="4"/>
<text x="65" y="14" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" stroke="none">API Gateway</text>
    </g>
    <g transform="translate(260,200)" fill="#f8fafc" stroke="#64748b">
      <rect x="0" y="0" width="60" height="20" rx="4" ry="4"/>
<text x="30" y="14" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" stroke="none">Auth</text>
    </g>
    <g transform="translate(220,260)" fill="#f8fafc" stroke="#64748b">
      <rect x="0" y="0" width="70" height="20" rx="4" ry="4"/>
<text x="35" y="14" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" stroke="none">Users</text>
    </g>
    <g transform="translate(320,260)" fill="#f8fafc" stroke="#64748b">
      <rect x="0" y="0" width="100" height="20" rx="4" ry="4"/>
<text x="50" y="14" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" stroke="none">Sessions</text>
    </g>
    <g transform="translate(60,200)" fill="#f8fafc" stroke="#64748b">
      <rect x="0" y="0" width="100" height="20" rx="4" ry="4"/>
<text x="50" y="14" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" stroke="none">Products</text>
    </g>
    <g transform="translate(70,260)" fill="#f8fafc" stroke="#64748b">
      <rect x="0" y="0" width="80" height="20" rx="4" ry="4"/>
<text x="40" y="14" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" stroke="none">Orders</text>
    </g>
    <g transform="translate(60,460)" fill="#f8fafc" stroke="#64748b">
      <rect x="0" y="0" width="100" height="20" rx="4" ry="4"/>
<text x="50" y="14" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" stroke="none">Postgres</text>
    </g>
    <g transform="translate(240,460)" fill="#f8fafc" stroke="#64748b">
      <rect x="0" y="0" width="70" height="20" rx="4" ry="4"/>
<text x="35" y="14" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" stroke="none">Redis</text>
    </g>
  </g>
</svg>
