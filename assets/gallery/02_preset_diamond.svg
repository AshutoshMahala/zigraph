<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     width="280" height="240" 
     viewBox="0 0 280 240">

  <!-- Marker definitions -->
  <defs>
    <marker id="zg-m-0" markerWidth="8" markerHeight="8" 
            refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 8 4, 0 8" fill="#666666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="white"/>
  <!-- Edges (rendered first, under nodes) -->
  <g id="edges">
    <line x1="130" y1="40" x2="130" y2="80" 
          stroke="#666666" stroke-width="2" marker-end="url(#zg-m-0)"/>
    <line x1="130" y1="100" x2="70" y2="140" 
          stroke="#666666" stroke-width="2" marker-end="url(#zg-m-0)"/>
    <line x1="130" y1="100" x2="200" y2="140" 
          stroke="#666666" stroke-width="2" marker-end="url(#zg-m-0)"/>
    <line x1="70" y1="160" x2="140" y2="200" 
          stroke="#666666" stroke-width="2" marker-end="url(#zg-m-0)"/>
    <line x1="200" y1="160" x2="140" y2="200" 
          stroke="#666666" stroke-width="2" marker-end="url(#zg-m-0)"/>
  </g>

  <!-- Nodes -->
  <g id="nodes">
    <g transform="translate(100,20)" fill="#f0f0f0" stroke="#333333">
      <polygon points="35,0 70,10 35,20 0,10"/>
<text x="35" y="14" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" stroke="none">Start</text>
    </g>
    <g transform="translate(100,80)" fill="#f0f0f0" stroke="#333333">
      <polygon points="35,0 70,10 35,20 0,10"/>
<text x="35" y="14" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" stroke="none">Parse</text>
    </g>
    <g transform="translate(20,140)" fill="#f0f0f0" stroke="#333333">
      <polygon points="50,0 100,10 50,20 0,10"/>
<text x="50" y="14" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" stroke="none">Validate</text>
    </g>
    <g transform="translate(150,140)" fill="#f0f0f0" stroke="#333333">
      <polygon points="55,0 110,10 55,20 0,10"/>
<text x="55" y="14" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" stroke="none">Transform</text>
    </g>
    <g transform="translate(100,200)" fill="#f0f0f0" stroke="#333333">
      <polygon points="40,0 80,10 40,20 0,10"/>
<text x="40" y="14" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" stroke="none">Output</text>
    </g>
  </g>
</svg>
