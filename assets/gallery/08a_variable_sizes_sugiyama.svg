<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     width="390" height="440" 
     viewBox="0 0 390 440">

  <!-- Marker definitions -->
  <defs>
    <marker id="zg-m-0" markerWidth="8" markerHeight="8" 
            refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 8 4, 0 8" fill="#3e63dd"/>
    </marker>
    <marker id="zg-m-1" markerWidth="8" markerHeight="8" 
            refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 8 4, 0 8" fill="#e54d2e"/>
    </marker>
    <marker id="zg-m-2" markerWidth="8" markerHeight="8" 
            refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 8 4, 0 8" fill="#30a46c"/>
    </marker>
    <marker id="zg-m-3" markerWidth="8" markerHeight="8" 
            refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 8 4, 0 8" fill="#f76b15"/>
    </marker>
    <marker id="zg-m-4" markerWidth="8" markerHeight="8" 
            refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 8 4, 0 8" fill="#8e4ec6"/>
    </marker>
    <marker id="zg-m-5" markerWidth="8" markerHeight="8" 
            refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 8 4, 0 8" fill="#12a594"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="white"/>
  <!-- Edges (rendered first, under nodes) -->
  <g id="edges">
    <line x1="190" y1="40" x2="80" y2="80" 
          stroke="#3e63dd" stroke-width="2" data-type="edge" data-from="1" data-to="2" marker-end="url(#zg-m-0)"/>
    <line x1="190" y1="40" x2="270" y2="80" 
          stroke="#e54d2e" stroke-width="2" data-type="edge" data-from="1" data-to="3" marker-end="url(#zg-m-1)"/>
    <line x1="80" y1="160" x2="190" y2="200" 
          stroke="#30a46c" stroke-width="2" data-type="edge" data-from="2" data-to="4" marker-end="url(#zg-m-2)"/>
    <line x1="270" y1="100" x2="190" y2="200" 
          stroke="#f76b15" stroke-width="2" data-type="edge" data-from="3" data-to="4" marker-end="url(#zg-m-3)"/>
    <line x1="190" y1="220" x2="190" y2="260" 
          stroke="#8e4ec6" stroke-width="2" data-type="edge" data-from="4" data-to="5" marker-end="url(#zg-m-4)"/>
    <line x1="190" y1="360" x2="190" y2="400" 
          stroke="#12a594" stroke-width="2" data-type="edge" data-from="5" data-to="6" marker-end="url(#zg-m-5)"/>
  </g>

  <!-- Nodes -->
  <g id="nodes">
    <g transform="translate(160,20)" fill="#dcfce7" stroke="#22c55e" data-type="node" data-id="1">
      <rect x="0" y="0" width="70" height="20" rx="6" ry="6"/>
<text x="35" y="10" text-anchor="middle" font-family="monospace" font-size="12" fill="#333" stroke="none">Start</text>
<text x="35" y="26" text-anchor="middle" font-family="monospace" font-size="9" fill="#999" stroke="none">70×20px</text>
    </g>
    <g transform="translate(20,80)" fill="#dcfce7" stroke="#22c55e" data-type="node" data-id="2">
      <rect x="0" y="0" width="120" height="80" rx="6" ry="6"/>
<text x="60" y="40" text-anchor="middle" font-family="monospace" font-size="12" fill="#333" stroke="none">Tall Card</text>
<text x="60" y="56" text-anchor="middle" font-family="monospace" font-size="9" fill="#999" stroke="none">120×80px</text>
    </g>
    <g transform="translate(170,80)" fill="#ffedd5" stroke="#f97316" data-type="node" data-id="3">
      <rect x="0" y="0" width="200" height="20" rx="6" ry="6"/>
<text x="100" y="10" text-anchor="middle" font-family="monospace" font-size="12" fill="#333" stroke="none">Wide Banner</text>
<text x="100" y="26" text-anchor="middle" font-family="monospace" font-size="9" fill="#999" stroke="none">200×20px</text>
    </g>
    <g transform="translate(150,200)" fill="#dcfce7" stroke="#22c55e" data-type="node" data-id="4">
      <rect x="0" y="0" width="80" height="20" rx="6" ry="6"/>
<text x="40" y="10" text-anchor="middle" font-family="monospace" font-size="12" fill="#333" stroke="none">Normal</text>
<text x="40" y="26" text-anchor="middle" font-family="monospace" font-size="9" fill="#999" stroke="none">80×20px</text>
    </g>
    <g transform="translate(100,260)" fill="#dbeafe" stroke="#3b82f6" data-type="node" data-id="5">
      <rect x="0" y="0" width="180" height="100" rx="6" ry="6"/>
<text x="90" y="50" text-anchor="middle" font-family="monospace" font-size="12" fill="#333" stroke="none">Dashboard</text>
<text x="90" y="66" text-anchor="middle" font-family="monospace" font-size="9" fill="#999" stroke="none">180×100px</text>
    </g>
    <g transform="translate(170,400)" fill="#dcfce7" stroke="#22c55e" data-type="node" data-id="6">
      <rect x="0" y="0" width="50" height="20" rx="6" ry="6"/>
<text x="25" y="10" text-anchor="middle" font-family="monospace" font-size="12" fill="#333" stroke="none">End</text>
<text x="25" y="26" text-anchor="middle" font-family="monospace" font-size="9" fill="#999" stroke="none">50×20px</text>
    </g>
  </g>
</svg>
