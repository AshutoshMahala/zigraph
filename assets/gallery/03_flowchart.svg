    <text x="210" y="480" font-family="monospace" font-size="11"
          fill="#c62828" text-anchor="middle" dy="-6" dominant-baseline="auto">"no"</text>
  </g>

  <!-- Nodes -->
  <g id="nodes">
    <g transform="translate(100,20)" fill="#e8f5e9" stroke="#4caf50">
      <polygon points="18,0 90,0 72,20 0,20"/>
<text x="45" y="14" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" stroke="none">> Input</text>
    </g>
    <g transform="translate(90,120)" fill="#e3f2fd" stroke="#2196f3">
