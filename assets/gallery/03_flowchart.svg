<text x="80" y="14" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" stroke="none">> Response 200</text>
    </g>
    <g transform="translate(210,520)" fill="#e8f5e9" stroke="#4caf50">
      <polygon points="26,0 130,0 104,20 0,20"/>
<text x="65" y="14" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" stroke="none">> Error 401</text>
    </g>
    <g transform="translate(240,320)" fill="#e8f5e9" stroke="#4caf50">
      <polygon points="26,0 130,0 104,20 0,20"/>
<text x="65" y="14" text-anchor="middle" font-family="monospace" font-size="12" fill="#333333" stroke="none">> Error 400</text>
    </g>
