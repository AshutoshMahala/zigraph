<extend template="base.shtml">
<head id="head">
</head>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-group">
    <div class="sidebar-heading" :text="$page.parentSection().title"></div>
    <div :loop="$page.parentSection().subpages()">
      <a href="$loop.it.link()" :text="$loop.it.title"></a>
    </div>
  </div>
</aside>
<main class="content" id="content">
  <h1 :text="$page.title"></h1>
  <div :html="$page.content()"></div>
  <div class="page-nav">
    <ctx :if="$page.prevPage?()">
      <a href="$if.link()">
        &larr; <span :text="$if.title"></span>
      </a>
    </ctx>
    <ctx :if="$page.nextPage?()">
      <a href="$if.link()">
        <span :text="$if.title"></span> &rarr;
      </a>
    </ctx>
  </div>
</main>
<aside class="toc" id="toc">
  <div class="toc-title">On this page</div>
  <div :html="$page.toc()"></div>
</aside>
